.app{--scale:1;--brand:#1f3be0;--onbrand:#fff;--brandsoft:#dce2ff;--onbrandsoft:#0b1c7a;--desk:#d9e1f7;--paper:#fff;--alt:#eef2fc;--dim:#d3dcf3;--ink:#0e1630;--soft:#434e72;--outline:#6975a0;--rule:#b9c5e6;--band:#1f3be0;--gain:#0a6b4a;--gainsoft:#cdefe0;--loss:#b81e2a;--losssoft:#fbd9db;--warn:#8a4a00;
  font-size:calc(14px * var(--scale));line-height:1.35;color:var(--ink);background:var(--desk);height:100%;display:flex;flex-direction:column;position:relative}

.top{background:var(--band);color:#fff;flex:none}

  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 5px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0) bottom/10px 5px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 5px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0) bottom/10px 5px repeat-x}

.label{color:var(--soft);font-size:1em;font-weight:500}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}

.circle::before{content:"";position:absolute;inset:auto 0 0 0;height:var(--fill);background:var(--c)}

.frame-card.small{width:320px}

.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
.chips{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:max-content;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px;
  -webkit-mask:linear-gradient(90deg,#000 calc(100% - 16px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 16px),transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px 0 9px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);font-weight:600;font-size:.93em;white-space:nowrap}

.legend span{display:inline-flex;align-items:center;gap:6px}

.tab-title{margin:0;font-size:1.5em;font-weight:800;letter-spacing:-.02em;color:#fff}
.top-actions{display:flex}
.primary.goal{background:var(--gain);color:#fff}

.app{--ongain:#fff}
.app[data-theme=dark]{--ongain:#06231a}
@keyframes stamp-land{0%{opacity:0;transform:scale(2.4) rotate(-24deg)}60%{opacity:1;transform:scale(.9) rotate(-8deg)}82%{transform:scale(1.05) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}

<div class="section"><p class="lede">SELLO-123. Spending only (owner, 2026-10-26): goal and investment records are not shown as destinations (ADR 0012 BG4). Synthetic figures.</p>
<div class="frames" id="today"></div>
<div class="frames" id="concepts"></div></div>
<script>// Shared helpers for the Sello v2 mockups. Money is exact COP text, never computed policy.
const fmt = n => (n < 0 ? "−" : "") + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const spoken = n => (n < 0 ? "menos " : "") + fmt(Math.abs(n)) + " pesos";
const icon = (name, cls = "") => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const money = (n, cls = "") => `<span class="money ${n < 0 ? "neg" : ""} ${cls}" aria-label="${spoken(n)}">${fmt(n)}</span>`;
const statusbar = () => `<div class="statusbar"><span>9:41</span><span>▲ ● ▮</span></div>`;
const reviewOptions = ids => Object.fromEntries(ids.map(id => [id, document.getElementById(id).value]));

// App frame shared by the tab screens: month bar, scrolling content, Anotar dock and tabs.
function appShell({ month = "Octubre", body, tabs = 3, active = 0, toast, notice, current, title, addLabel, band = "", dock = "Anotar", dockClass = "" }) {
  const all = [["receipt_long", "Recibo"], ["insights", "Resumen"], ["flag", "Metas"], ["account_balance", "Inversiones"]].slice(0, tabs);
  const nav = all.map(([ic, t], i) => `<button ${i === active ? 'aria-current="page"' : ""}><span class="pill">${icon(ic)}</span><span class="t">${t}</span></button>`).join("");
  return `<div class="top">${statusbar()}<div class="topbar">${title ? `<h1 class="tab-title">${title}</h1>` : `<button class="month" aria-label="Cambiar mes, ${month} 2026">${month}<small>2026</small>${icon("keyboard_arrow_down")}</button>`}<span class="top-actions">${addLabel ? `<button class="icon-btn" aria-label="${addLabel}">${icon("add")}</button>` : ""}<button class="icon-btn" aria-label="Configuración">${icon("settings")}</button></span></div>${current ? pastRibbon(month, current) : ""}${band}</div><main class="content">${body}</main><div class="bottom"><div class="dock"><button class="primary ${dockClass}">${dockClass === "goal" ? icon("flag") : dockClass === "plain" ? "" : icon("add")}${dock}</button></div><nav class="nav">${nav}</nav><div class="gesture"></div></div>${toast ? `<div class="toast" role="status">${icon("check")}${toast}</div>` : ""}${notice ? noticeBar(notice) : ""}`;
}

// What catch-up recorded, above Anotar on Recibo until the person dismisses it (SELLO-114).
const noticeBar = text => `<div class="toast notice" role="status">${icon("autorenew")}<span>${text}</span><button class="undo">Ver</button></div>`;

// Shown on every tab screen while the selected month is not the current one.
const pastRibbon = (month, current) => `<div class="past-ribbon" role="status">${icon("event")}<span>Estás viendo <b>${month.toLowerCase()}</b></span><button>Volver a ${current}</button></div>`;

// Frame for a screen pushed inside a tab: back arrow and title, same dock and tabs.
function subShell({ title, body, tabs = 3, active = 1, dock = "Anotar", dockClass = "", month = "Octubre", current, action, band = "" }) {
  const all = [["receipt_long", "Recibo"], ["insights", "Resumen"], ["flag", "Metas"], ["account_balance", "Inversiones"]].slice(0, tabs);
  const nav = all.map(([ic, t], i) => `<button ${i === active ? 'aria-current="page"' : ""}><span class="pill">${icon(ic)}</span><span class="t">${t}</span></button>`).join("");
  return `<div class="top">${statusbar()}<div class="topbar sub"><button class="icon-btn" aria-label="Volver">${icon("arrow_back")}</button><h1 class="sub-title">${title}</h1>${(action ? (Array.isArray(action[0]) ? action : [action]) : []).map(([ic, label, pressed]) => `<button class="icon-btn sub-action" aria-label="${label}" ${pressed !== undefined ? `aria-pressed="${pressed}"` : ""}>${icon(ic)}</button>`).join("")}</div>${current ? pastRibbon(month, current) : ""}${band}</div><main class="content">${body}</main><div class="bottom">${dock ? `<div class="dock"><button class="primary ${dockClass}">${dockClass === "goal" ? icon("flag") : dockClass === "plain" ? "" : icon("add")}${dock}</button></div>` : ""}<nav class="nav">${nav}</nav><div class="gesture"></div></div>`;
}
</script><script>// SELLO-123 · merged: the income receipt with "¿Dónde se va?"'s rows. Synthetic figures.
const CAT = { Hogar: "home", Comida: "restaurant", Café: "local_cafe", Transporte: "directions_bus", Ocio: "theaters" };
const RANK = [["Hogar", 200000], ["Comida", 80000], ["Café", 60000], ["Transporte", 40000], ["Ocio", 20000]];
const rows = () => { const t = RANK.reduce((a, [, n]) => a + n, 0); return RANK.map(([name, n]) => `<button class="rank-row"><span class="circle" style="--fill:100%" aria-hidden="true">${icon(CAT[name])}<span class="on">${icon(CAT[name])}</span></span><span class="rank-main"><span>${name}</span><span class="share" aria-hidden="true"><i style="width:${100 * n / t}%"></i></span></span><b>${money(n)}</b>${icon("chevron_right", "chev")}</button>`).join(""); };
const stub = (inc, fixed) => `<div class="tear" aria-hidden="true"></div><div class="stub centered"><button>${icon("receipt_long")}<span><b>Ingresos</b><small>${inc}</small></span></button><i aria-hidden="true"></i><button>${icon("autorenew")}<span><b>Fijos</b><small>${fixed}</small></span></button></div>`;
const withIncome = () => `<section class="slip pinked"><h2 class="q">¿A dónde fue lo que entró?</h2>
  <div class="leader big"><span>Entró en octubre</span><i class="dots" aria-hidden="true"></i><b>${money(2000000)}</b></div>
  <div class="seg"><i class="gasto" style="flex:.2"></i><i class="free" style="flex:.8"></i></div>
  <p class="basis">Lo gastado en octubre, hasta el 22</p>
  <div class="rank">${rows()}</div>
  <div class="leader sub"><span>Gastos</span><i class="dots" aria-hidden="true"></i><b>${money(400000)}</b></div>
  <div class="total-line big-total"><span>Ingresos menos gastos</span>${money(1600000)}</div>
  ${stub("3 en octubre", "Próximo: 28 oct")}</section>`;
const noIncome = () => `<section class="slip pinked"><h2 class="q">¿A dónde fue lo que entró?</h2>
  <p class="none">Aún no anotas ingresos en octubre.</p>
  <p class="basis">Lo gastado en octubre, hasta el 22</p>
  <div class="rank">${rows()}</div>
  <div class="total-line"><span>Total</span>${money(400000)}</div>
  ${stub("Ninguno en octubre", "Ninguno activo")}</section>`;
const crop = (o, inner) => `<div class="app pad-crop" data-ink="${o.ink}" data-theme="${o.theme}">${inner}</div>`;
const card = (title, note, inner) => `<div class="frame-card"><h3>${title}</h3><p>${note}</p>${inner}</div>`;
function render() {
  const o = reviewOptions(["ink", "theme"]);
  document.getElementById("today").innerHTML =
    card("With income", "Entró and its bar, then every category as “¿Dónde se va?” shows it today, the Gastos sum, Ingresos menos gastos and the stub.", crop(o, withIncome())) +
    card("No income recorded", "The same rows and Total, without income lines: what “¿Dónde se va?” is today.", crop(o, noIncome()));
  document.getElementById("concepts").innerHTML = "";
}
document.querySelectorAll(".controls select").forEach(s => s.addEventListener("change", render));
render();
</script></body></html>
