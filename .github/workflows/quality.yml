name: Quality

# Every candidate reports one required quality check. Parts are execution evidence,
# not independently successful gates. Event/gate policy remains ADR 0009: a green
# pull request lands as it is, the push to main keeps the host gate, and the nightly
# verifies the whole of main at G3 only when main moved since the last successful
# nightly (amendment of 2026-10-26).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  EVENT: ${{ github.event_name }}

jobs:
  plan:
    name: Select gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      unchanged: ${{ steps.nightly.outputs.unchanged }}
      gate: ${{ steps.plan.outputs.gate }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - name: Skip a nightly when main has not moved
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ -n "$verified" ] && [ "$verified" = "$GITHUB_SHA" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "main is still at $GITHUB_SHA, which the last successful nightly verified; nothing to run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "main moved from ${verified:-no verified nightly} to $GITHUB_SHA; verifying the whole gate." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.nightly.outputs.unchanged != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what this run verifies
        id: plan
        if: steps.nightly.outputs.unchanged != 'true'
        run: |
          ./scripts/verify-ticket --ci-plan "$BASE" --ci-event "$EVENT" > /tmp/quality-plan.json
          python3 - <<'PYPLAN'
          import json, os
          plan = json.load(open('/tmp/quality-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('gate=' + plan['gate'], file=output)
              print('groups=' + json.dumps(plan['groups']), file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(json.dumps(plan, indent=2), file=summary)
          PYPLAN

  host:
    name: Host checks
    needs: plan
    if: needs.plan.outputs.unchanged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: needs.plan.outputs.gate != 'G0'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle caching
        if: needs.plan.outputs.gate != 'G0'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          add-job-summary: always
          add-job-summary-as-pr-comment: never
          build-scan-publish: false
          dependency-graph: disabled

      - name: Accept Android SDK licences
        if: needs.plan.outputs.gate != 'G0'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Verify host part
        run: ./scripts/verify-ticket --merge-candidate "$BASE" --ci-part host --ci-event "$EVENT"

      - name: Keep host part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-part-${{ github.run_attempt }}-host
          retention-days: 90
          if-no-files-found: error
          path: build/reports/quality-parts/quality-part-${{ github.run_attempt }}-host/

  device:
    name: Device tests (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.gate == 'G2' || needs.plan.outputs.gate == 'G3'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      DEVICE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Job identity separates host/device caches; matrix context separates groups.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          add-job-summary: always
          add-job-summary-as-pr-comment: never
          build-scan-publish: false
          dependency-graph: disabled

      - name: Locate Android system image
        id: android-image
        run: echo "path=$ANDROID_HOME/system-images/android-30/google_apis/x86_64" >> "$GITHUB_OUTPUT"

      - name: Restore Android system image
        id: android-image-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.android-image.outputs.path }}
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-api30-google_apis-x86_64-lookup
          restore-keys: android-image-v1-${{ runner.os }}-${{ runner.arch }}-api30-google_apis-x86_64-

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify device part on API 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/verify-ticket --merge-candidate "$BASE" --ci-part "$DEVICE_GROUP" --ci-event "$EVENT"

      - name: Validate completion evidence before cache publication
        run: python3 scripts/quality/tickets.py check --base "$BASE"

      - name: Identify installed Android system image
        if: matrix.group == 'support' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: android-image-key
        run: |
          sdk_image_metadata=$(sha256sum "$ANDROID_HOME/system-images/android-30/google_apis/x86_64/source.properties")
          echo "key=android-image-v1-${{ runner.os }}-${{ runner.arch }}-api30-google_apis-x86_64-${sdk_image_metadata%% *}" >> "$GITHUB_OUTPUT"

      - name: Save Android system image
        if: matrix.group == 'support' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.android-image-cache.outputs.cache-matched-key != steps.android-image-key.outputs.key
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.android-image.outputs.path }}
          key: ${{ steps.android-image-key.outputs.key }}

      - name: Keep device part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-part-${{ github.run_attempt }}-${{ matrix.group }}
          retention-days: 90
          if-no-files-found: error
          path: build/reports/quality-parts/quality-part-${{ github.run_attempt }}-${{ matrix.group }}/

  quality:
    name: quality
    needs: [plan, host, device]
    if: always() && needs.plan.outputs.unchanged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download execution parts
        id: parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-part-${{ github.run_attempt }}-*
          path: build/ci-parts
          merge-multiple: false
          digest-mismatch: error

      - name: Collect full gate evidence
        if: always() && steps.checkout.outcome == 'success' && steps.parts.outcome == 'success'
        env:
          QUALITY_PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_HOST_RESULT: ${{ needs.host.result }}
          QUALITY_DEVICE_RESULT: ${{ needs.device.result }}
        run: ./scripts/verify-ticket --merge-candidate "$BASE" --ci-collect build/ci-parts --ci-event "$EVENT"

      - name: Validate completion evidence
        run: python3 scripts/quality/tickets.py check --base "$BASE"

      - name: Keep full gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          retention-days: 90
          if-no-files-found: error
          path: build/reports/quality/
