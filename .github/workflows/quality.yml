name: Quality

# The pull request's required `quality` check is the only proof that checks passed
# (ADR 0021). The plan picks the gate from the changed paths; cheap checks run before
# any Gradle or emulator work; `quality` judges each job's result against the plan, so
# "Re-run failed jobs" works. A push to main keeps the host gate to publish trusted
# caches; the nightly verifies the whole of main at G3 only when main moved since the
# last successful nightly; a manual run does the same on its ref.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its run. Every other run gets its own group
  # (one per commit), so no push, nightly or manual run is cancelled or superseded.
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  EVENT: ${{ github.event_name }}

jobs:
  plan:
    name: Plan and fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      unchanged: ${{ steps.nightly.outputs.unchanged }}
      gate: ${{ steps.plan.outputs.gate }}
      host: ${{ steps.plan.outputs.host }}
      release: ${{ steps.plan.outputs.release }}
      device: ${{ steps.plan.outputs.device }}
      groups: ${{ steps.plan.outputs.groups }}
      modules: ${{ steps.plan.outputs.modules }}
    steps:
      - name: Skip a nightly when main has not moved
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ -n "$verified" ] && [ "$verified" = "$GITHUB_SHA" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "main is still at $GITHUB_SHA, which the last successful nightly verified; nothing to run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "main moved from ${verified:-no verified nightly} to $GITHUB_SHA; verifying the whole gate." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.nightly.outputs.unchanged != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what this run verifies
        id: plan
        if: steps.nightly.outputs.unchanged != 'true'
        run: ./scripts/check --plan "$BASE" --event "$EVENT"

      - name: Run the fast checks
        if: steps.nightly.outputs.unchanged != 'true'
        run: ./scripts/check --fast

  host:
    name: Host checks
    needs: plan
    if: needs.plan.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: ${{ needs.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          add-job-summary: always
          add-job-summary-as-pr-comment: never
          build-scan-publish: false
          dependency-graph: disabled

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Run the host gate
        run: |
          if [ "$RELEASE" = true ]; then
            ./scripts/check --host --ci-release
          else
            ./scripts/check --host
          fi

      - name: Keep host reports of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-reports-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            */build/reports/tests/
            */build/reports/lint-results-debug.html
            */build/reports/ktlint/

  device:
    name: Device tests (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.device == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      DEVICE_GROUP: ${{ matrix.group }}
      DEVICE_MODULES: ${{ needs.plan.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Job identity separates host/device caches; matrix context separates groups.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          add-job-summary: always
          add-job-summary-as-pr-comment: never
          build-scan-publish: false
          dependency-graph: disabled

      - name: Check formatting and build the test APKs
        run: ./scripts/check --device "$DEVICE_GROUP" --modules "$DEVICE_MODULES" --build-only

      - name: Locate Android system image
        id: android-image
        run: echo "path=$ANDROID_HOME/system-images/android-30/google_apis/x86_64" >> "$GITHUB_OUTPUT"

      - name: Restore Android system image
        id: android-image-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.android-image.outputs.path }}
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-api30-google_apis-x86_64-lookup
          restore-keys: android-image-v1-${{ runner.os }}-${{ runner.arch }}-api30-google_apis-x86_64-

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests on API 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # A hang fails the job in minutes instead of holding the runner for an hour.
        timeout-minutes: 25
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # The action runs each script line on its own, so one line keeps the exit status.
          # The emulator's crashpad_handler can outlive "emu kill" and keep the action
          # waiting until the job times out (seen 2026-10-29 after every test passed).
          script: ./scripts/check --device "$DEVICE_GROUP" --modules "$DEVICE_MODULES"; status=$?; killall -INT crashpad_handler || true; exit $status

      - name: Identify installed Android system image
        if: matrix.group == 'support' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: android-image-key
        run: |
          sdk_image_metadata=$(sha256sum "$ANDROID_HOME/system-images/android-30/google_apis/x86_64/source.properties")
          echo "key=android-image-v1-${{ runner.os }}-${{ runner.arch }}-api30-google_apis-x86_64-${sdk_image_metadata%% *}" >> "$GITHUB_OUTPUT"

      - name: Save Android system image
        if: matrix.group == 'support' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.android-image-cache.outputs.cache-matched-key != steps.android-image-key.outputs.key
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.android-image.outputs.path }}
          key: ${{ steps.android-image-key.outputs.key }}

      - name: Keep device reports of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-reports-${{ github.run_attempt }}-${{ matrix.group }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            */build/reports/androidTests/
            */build/outputs/androidTest-results/

  quality:
    name: quality
    needs: [plan, host, device]
    if: always() && needs.plan.outputs.unchanged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Judge every job against the plan
        env:
          GATE: ${{ needs.plan.outputs.gate }}
          DEVICE_GROUPS: ${{ needs.plan.outputs.groups }}
          PLAN_RESULT: ${{ needs.plan.result }}
          HOST_RESULT: ${{ needs.host.result }}
          HOST_SELECTED: ${{ needs.plan.outputs.host }}
          DEVICE_RESULT: ${{ needs.device.result }}
          DEVICE_SELECTED: ${{ needs.plan.outputs.device }}
        run: |
          failed=0
          report="### quality: ${GATE:-no plan}"$'\n\n'"| Job | Result | Expected |"$'\n'"| --- | --- | --- |"
          judge() {
            expected=skipped
            if [ "$3" = true ]; then expected=success; fi
            report+=$'\n'"| $1 | $2 | $expected |"
            if [ "$2" != "$expected" ]; then failed=1; fi
          }
          judge "Plan and fast checks" "$PLAN_RESULT" true
          judge "Host checks" "$HOST_RESULT" "$HOST_SELECTED"
          judge "Device tests ${DEVICE_GROUPS:-[]}" "$DEVICE_RESULT" "$DEVICE_SELECTED"
          echo "$report"
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" = 1 ]; then
            echo "A selected job did not succeed, or a job ran that the plan did not select. Open the failed job; its summary lists failing tests. Fix the cause, then re-run the failed jobs."
            exit 1
          fi
